<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mebay</title>
        <link
            rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
            integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"
        >
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <!-- flexbox container -->
        <div id="layout">
            <!-- flexbox item -->
            <div id="thumbnail-column">
                <div class="image-container">
                    <img src="images/smallmainside.webp" alt="Mini picture">
                </div>

                <div class="image-container">
                    <img src="images/size.webp" alt="3 turtles size picture">
                </div>

                <div class="image-container">
                    <img src="images/piramid.webp" alt="Pyramid picture">
                </div>

                <div class="image-container">
                    <img src="images/facingleft.webp" alt="Look left picture">
                </div>

                <div class="image-container">
                    <img src="images/upside.webp" alt="Back of shell picture">
                </div>

                <div class="image-container">
                    <img src="images/stacked.webp" alt="Stacked picture">
                </div>
            </div>

            <!-- flexbox item -->
            <div id="featured-image-column">
                <img src="images/turtlemain.webp" alt="3 turtles large picture">
            </div>

            <!-- flexbox item -->
            <div id="product-info-column">
                <h2>
                    3pcs Vintage Brass Turtle Figurine Statue Home Ornaments 
                    Animal Figurines Gift
                </h2>
                <!-- seller profile -->
                <div id="sp"><a href="#">joint2018</a></div>
                <p>(16836)</p>
                <div id="seller-info">
                    <a href="#">99% positive</a>
                    
                    <a href="#">Seller's other items</a>
                    <a href="#">Contact seller</a>
                </div>
                <h2>US $13.79</h2>
                <p>Condition: &emsp;New</p>
                <div class="buttons">
                    <a href="#" id="bn">But It Now</a>
                    <a href="#" class="wb">Add to cart</a>
                    <a href="#" class="wb">
                        <i 
                            class="fa-regular fa-heart" 
                            style="color: #0968f6;"
                        >
                        </i>
                        Add to Watchlist
                    </a>
                </div>
            </div>

        </div>
    </body>
</html>
