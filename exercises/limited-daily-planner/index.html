<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Daily Planner</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="morning">
            <h2>Morning to-do list</h2>
            <ul>
                <li class="completed">Brush Teeth</li>
                <a href="#" class="button">Complete</a>
                <li>Eat Breakfast</li>
                <li class="completed important">Make Coffee</li>
                <a href="#" class="button">Complete</a>
            </ul>
            
        </div>
        <div id="afternoon">
            <h2>Afternoon to-do list</h2>
            <ul>
                <li>Eat Lunch</li>
                <li>Answer Emails</li>
                <li class="completed important">Take Nap</li>
            </ul>
        </div>
        <div id="evening">
            <h2>Evening to-do list</h2>
            <ul>
                <li>Eat Dinner</li>
                <li>Prep Clothes</li>
                <li>Brush Teeth</li>
                <li class="completed important">Knock Out</li>
            </ul>
        </div>
    </body>
</html>
