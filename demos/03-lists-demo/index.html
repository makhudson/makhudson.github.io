<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Lists Demo</title>
        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <h3>Unordered List</h3>
        <ul>
            <li>Sauce</li>
            <li>Milk</li>
            <li>Eggs</li>
            <li>Coffee</li>
            <li>Chips</li>
            <li>Vitamins</li>
            <li>
                 <ol>
                    <li>juice</li>
                    <li>Grapes</li>
                 </ol>
            </li>
        </ul>
        <hr>
        <h3>Ordered List</h3>
        <ol>
            <li>Kitchen.</li>
            <li>Living Room.</li>
            <li>Bathroom.</li>
            <li>Animal Room.</li>
            <li>Stairs.</li>
            <li>Bedroom.</li>
        </ol>
    </body>
</html>
